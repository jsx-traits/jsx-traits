name: release

on:
  push:
    branches: [latest, next]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event.created == false &&
      !startsWith(github.event.head_commit.message, 'misc: release v') &&
      github.event.head_commit.message != 'misc: readme updates' &&
      github.event.head_commit.message != 'merge latest into next'
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - id: version
        run:
          npm start --workspace=@scripts/calculate-version -- ${{
          github.ref_name }}

      - run:
          npm start --workspace=@scripts/apply-version -- "${{
          steps.version.outputs.NEW_VERSION }}"
      - run:
          npm start --workspace=@scripts/readme -- --ref "v${{
          steps.version.outputs.NEW_VERSION }}"

      - uses: EndBug/add-and-commit@v9
        with:
          add: package.json package-lock.json README.md **/package.json
          message: "misc: release v${{ steps.version.outputs.NEW_VERSION }}"
          committer_name: JSX Traits Release Bot
          committer_email:
            ${{ vars.RELEASE_BOT_APP_ID
            }}+JSX-Traits-Release-Bot[bot]@users.noreply.github.com

      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: v${{ steps.version.outputs.NEW_VERSION }}
          target_commitish: ${{ github.ref_name }}
          prerelease: ${{ github.ref_name == 'next' }}
          body: ${{ steps.version.outputs.RELEASE_BODY }}

      - run:
          npm start --workspace=@scripts/readme -- --ref "v${{
          steps.version.outputs.NEW_VERSION }}" --npm

      - if: github.ref_name == 'latest'
        run: npm publish --workspaces --if-present --access public --provenance

      - if: github.ref_name == 'next'
        run:
          npm publish --workspaces --if-present --access public --provenance
          --tag next

  cleanup:
    runs-on: ubuntu-latest
    if: github.ref_name == 'latest'
    needs: publish
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: morbalint/git-merge-action@v1
        with:
          source: latest
          target: next
          strategy_options: ours
          user_name: JSX Traits Release Bot
          user_email:
            ${{ vars.RELEASE_BOT_APP_ID
            }}+JSX-Traits-Release-Bot[bot]@users.noreply.github.com
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v4
        with:
          ref: next
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm start --workspace=@scripts/readme -- --ref next

      - uses: EndBug/add-and-commit@v9
        with:
          add: README.md
          message: "misc: readme updates"
          committer_name: JSX Traits Release Bot
          committer_email:
            ${{ vars.RELEASE_BOT_APP_ID
            }}+JSX-Traits-Release-Bot[bot]@users.noreply.github.com

      - name: Maintain stable release PR
        run: |
          gh pr create \
            --title "misc: release latest" \
            --body "This automatically managed pull request promotes the next branch to latest. Merge it when the next stable release is ready." \
            --base latest \
            --head next \
            --repo "${{ github.repository }}" || true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
